<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisaab Billing Book - Hindi & English</title>
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    <div class="max-w-md mx-auto p-4">
        <header class="text-center my-6">
            <h1 class="text-2xl font-bold text-slate-800">Hisaab Billing Book</h1>
            <p class="text-sm text-slate-500">Hindi & English Billing Assistant</p>
        </header>

        <!-- Main Calculator Container -->
        <div class="bg-white rounded-2xl shadow-sm p-5 border border-slate-100">
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-1">Item Name / वस्तु का नाम</label>
                <input type="text" id="itemName" placeholder="e.g., T-Shirt / टी-शर्ट" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Quantity / मात्रा</label>
                    <input type="number" id="itemQty" value="1" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Price (₹) / कीमत</label>
                    <input type="number" id="itemPrice" placeholder="0" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <button onclick="calculateTotal()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">Add Item / जोड़ें</button>
        </div>

        <!-- Total Section -->
        <div class="mt-6 bg-slate-900 text-white p-4 rounded-2xl flex justify-between items-center">
            <span class="text-lg font-medium">Total / कुल राशि:</span>
            <span id="grandTotal" class="text-2xl font-bold">₹0</span>
        </div>
    </div>

    <script>
        function calculateTotal() {
            let qty = parseFloat(document.getElementById('itemQty').value) || 0;
            let price = parseFloat(document.getElementById('itemPrice').value) || 0;
            let total = qty * price;
            document.getElementById('grandTotal').innerText = '₹' + total.toFixed(2);
        }
    </script>
</body>
</html>
